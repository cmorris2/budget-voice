<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Add Budget Expense</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 30px 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    #status {
      margin: 20px 0;
      color: #666;
    }

    button {
      width: 100%;
      padding: 20px;
      margin: 10px 0;
      font-size: 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }

    #speakButton {
      background: #222;
      color: white;
    }

    #addButton {
      background: #2e7d32;
      color: white;
    }

    #cancelButton {
      background: #ddd;
    }

    #result {
      margin-top: 25px;
      padding: 20px;
      border-radius: 10px;
      background: #f5f5f5;
      line-height: 1.7;
    }

    label { display: block; text-align: left; margin-top: 12px; }
    input, select {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      font: inherit;
    }
    button:disabled { opacity: 0.6; cursor: wait; }

  </style>

</head>


<body>

  <h1>🎤 Add Budget Expense</h1>

  <div id="status" role="status" aria-live="polite">
    Tap to Speak, then review the details before adding the transaction.
  </div>

  <button id="speakButton">
    🎤 Tap to Speak
  </button>

  <form id="transactionForm">
  <div id="result">
    <strong>Review or enter transaction details</strong>
    <label for="amount">Amount</label>
    <input id="amount" type="number" min="0.01" step="0.01" required>
    <label for="description">Description</label>
    <input id="description" type="text" required>
    <label for="category">Category</label>
    <select id="category" required>
      <option value="">Choose a category</option>
    </select>
  </div>

  <button id="addButton" type="submit">
    Add Transaction
  </button>

  <button id="cancelButton" type="button">
    Cancel
  </button>
  </form>


<script type="module">

import { allowedCategories as categories } from "./shared/categories.mjs";


// =====================================================
// CONFIGURATION
// =====================================================

const WORKER_URL = "http://localhost:8787";
let isSubmitting = false;
let isParsing = false;
let isListening = false;
let formRevision = 0;
const form = document.getElementById("transactionForm");
const amountField = document.getElementById("amount");
const descriptionField = document.getElementById("description");
const categoryField = document.getElementById("category");
for (const category of categories) {
  const option = document.createElement("option");
  option.value = category;
  option.textContent = category;
  categoryField.append(option);
}
form.addEventListener("input", () => { formRevision++; });

function updateButtons() {
  document.getElementById("addButton").disabled = isListening || isParsing || isSubmitting;
  document.getElementById("cancelButton").disabled = isListening || isSubmitting;
  document.getElementById("speakButton").disabled = isListening || isParsing || isSubmitting || !SpeechRecognition;
  for (const field of [amountField, descriptionField, categoryField]) field.disabled = isSubmitting;
}

async function analyzeTransaction(transcript, revision) {
  if (isParsing || isSubmitting) return;
  const text = transcript.trim();
  if (!text || text.length > 2000) {
    showError("Please speak a transaction of up to 2000 characters, or enter the details manually.");
    return;
  }
  isParsing = true;
  updateButtons();
  document.getElementById("status").innerText = "Analyzing transaction...";
  try {
    const response = await fetch(WORKER_URL + "/api/parse-transaction", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
      signal: AbortSignal.timeout(30000)
    });
    const data = await response.json();
    if (!response.ok) throw new Error("Parsing failed");
    if (typeof data?.amount !== "number" || !Number.isFinite(data.amount) || data.amount <= 0 ||
        typeof data.description !== "string" || !data.description.trim() || !categories.includes(data.category)) {
      throw new Error("Invalid transaction response");
    }
    if (revision !== formRevision) {
      document.getElementById("status").innerText = "Your manual changes were kept. Tap to Speak again if you want to replace them.";
      return;
    }
    transaction = { amount: data.amount, description: data.description, category: data.category };
    showTransaction();
    document.getElementById("status").innerText = "Review and edit the details, then select Add Transaction to save.";
  } catch {
    showError("Could not analyze the transaction. Try again or enter the details manually.");
  } finally {
    isParsing = false;
    updateButtons();
  }
}


// =====================================================
// STATE
// =====================================================

let transaction = null;


// =====================================================
// SPEECH RECOGNITION
// =====================================================

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (!SpeechRecognition) {

  document.getElementById("speakButton").disabled = true;
  document.getElementById("speakButton").title = "Speech recognition is not supported by this browser.";
  document.getElementById("status").innerText = "Speech recognition is not supported by this browser. Enter the details manually below.";

}
else {

  const recognition =
    new SpeechRecognition();

  recognition.lang = "en-US";

  recognition.interimResults = false;

  recognition.continuous = false;
  let listeningRevision = 0;
  let receivedResult = false;
  let speechFailed = false;


  document
    .getElementById("speakButton")
    .addEventListener("click", function() {
      if (isListening || isParsing || isSubmitting) return;
      listeningRevision = formRevision;
      receivedResult = false;
      speechFailed = false;
      isListening = true;
      updateButtons();
      document.getElementById("status").innerText =
        "Listening...";

      try {
        recognition.start();
      } catch {
        isListening = false;
        speechFailed = true;
        updateButtons();
        showError("Could not start speech recognition. Try again or enter the details manually.");
      }

    });


  recognition.onresult = function(event) {

    if (!isListening || receivedResult || isParsing || isSubmitting) return;
    receivedResult = true;

    const transcript =
      event.results[0][0].transcript;

    return analyzeTransaction(transcript, listeningRevision);

  };


  recognition.onerror = function(event) {
    speechFailed = true;
    document.getElementById("status").innerText =
      "Speech error: " + event.error;

  };

  recognition.onend = function() {
    isListening = false;
    updateButtons();
    if (!receivedResult && !speechFailed) {
      showError("No speech was heard. Try again or enter the details manually.");
    }
  };

}


// =====================================================
// DISPLAY TRANSACTION
// =====================================================

function showTransaction() {
  amountField.value = String(transaction.amount);
  descriptionField.value = transaction.description;
  categoryField.value = transaction.category;
  formRevision++;
}


// =====================================================
// SEND TO WORKER
// =====================================================

document
  .getElementById("transactionForm")
  .addEventListener("submit", async function(event) {
    event.preventDefault();

    if (isListening || isParsing || isSubmitting) {
      return;
    }

    if (!form.reportValidity()) return;
    // Read the current fields, including edits made after AI parsing.
    const confirmedTransaction = {
      amount: Number(amountField.value),
      description: descriptionField.value.trim(),
      category: categoryField.value
    };
    if (!Number.isFinite(confirmedTransaction.amount) || confirmedTransaction.amount <= 0 ||
        !confirmedTransaction.description || !categories.includes(confirmedTransaction.category)) {
      showError("Enter a positive amount, description, and category.");
      return;
    }


    document.getElementById("status").innerText =
      "Adding transaction...";


    isSubmitting = true;
    updateButtons();

    try {
      const response = await fetch(WORKER_URL + "/api/transactions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        // Explicit save fields: parsed dates are not persisted yet.
        body: JSON.stringify({
          amount: confirmedTransaction.amount,
          description: confirmedTransaction.description,
          category: confirmedTransaction.category
        })
      });


      const data =
        await response.json();


      if (response.ok && data.success === true) {

        document.getElementById("status").innerText =
          "✅ Transaction added!";


        reset();

      }
      else {

        showError(
          response.status === 502
            ? "Could not confirm the transaction. Check your spreadsheet before retrying to avoid duplicates."
            : (data.error || "The transaction request failed.")
        );

      }

    }

    catch (error) {

      showError(
        "Could not confirm the transaction. Check your spreadsheet before retrying to avoid duplicates."
      );

      console.error("Transaction request failed.");

    }
    finally {
      isSubmitting = false;
      updateButtons();
    }

  });


// =====================================================
// CANCEL
// =====================================================

document
  .getElementById("cancelButton")
  .addEventListener("click", reset);


// =====================================================
// RESET
// =====================================================

function reset() {

  transaction = null;

  form.reset();
  formRevision++;

}


// =====================================================
// ERROR
// =====================================================

function showError(message) {

  document.getElementById("status").innerText =
    "⚠️ " + message;

}

</script>

</body>

</html>
